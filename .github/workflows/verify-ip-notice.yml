# Proprietà intellettuale di Francesco Antonio Binetti
name: Verifica proprietà intellettuale

on:
  push:
  pull_request:

jobs:
  verify-notice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/manage-ip-notice.js check
