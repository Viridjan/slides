<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz di area</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme-corsi.css">
<style>
:root{--font-display:"Fraunces",Georgia,serif;--font-body:"Space Grotesk",sans-serif;--font-mono:"Space Mono",monospace}*{box-sizing:border-box}html,body{min-height:100%;overflow:auto}body{margin:0;background:var(--course-dark);color:var(--paper);font-family:var(--font-body);line-height:1.45}.page{max-width:1180px;margin:auto;padding:54px 34px 80px}.top{display:flex;justify-content:space-between;gap:24px;align-items:start;margin-bottom:30px}.badge{font:700 15px var(--font-mono);letter-spacing:2px;color:var(--accent);margin-bottom:12px}h1{font:900 64px/.98 var(--font-display);margin:0}.back{color:var(--paper);font:15px var(--font-mono);text-decoration:none;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:10px 15px}.questions{display:grid;gap:18px}.question{background:var(--paper);color:var(--ink);border-radius:10px;padding:22px;border-left:6px solid var(--accent)}.q-head{display:flex;gap:14px;align-items:start;margin-bottom:15px}.q-num{flex:0 0 48px;font:900 34px var(--font-display);color:var(--accent)}h2{font-size:24px;line-height:1.2;margin:3px 0 0}.options{display:grid;gap:9px}.option{display:flex;gap:11px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:rgba(255,255,255,.55)}.option input{margin-top:5px}.option.correct{border-color:#397a58;background:#dfeee7}.option.wrong{border-color:#b94e3c;background:#f8ded6}.feedback{display:none;margin:12px 0 0;color:var(--ink-soft)}.answered .feedback{display:block}.panel{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:26px;padding:22px;border:1px solid rgba(255,255,255,.2);border-radius:14px}.score strong{font:900 34px var(--font-display);color:var(--gold)}button{border:0;border-radius:9px;padding:13px 18px;background:var(--gold);color:var(--ink);font:700 17px var(--font-body);cursor:pointer}.secondary{background:transparent;color:var(--paper);border:1px solid rgba(255,255,255,.3)}@media(max-width:720px){.page{padding:36px 18px 60px}.top{display:block}h1{font-size:44px}.back{display:inline-block;margin-top:20px}}
</style>
</head>
<body>
<main class="page">
<header class="top"><div><div class="badge" id="areaCode"></div><h1 id="quizTitle">Quiz di area</h1></div><a class="back" href="00-indice.html">Indice</a></header>
<form class="questions" id="quiz"></form>
<section class="panel score" aria-live="polite"><div><strong id="score">0 / 20</strong></div><div><button id="check" type="button">Correggi quiz</button></div></section>
</main>
<script src="quiz-area-banks.js"></script>
<script>
const area=(new URLSearchParams(location.search).get('area')||'').toUpperCase();
const bank=window.AREA_QUIZ_BANKS?.[area];
if(!bank){document.getElementById('quizTitle').textContent='Quiz non disponibile';throw new Error('Area quiz non valida');}
document.body.className='course-'+bank.course;
document.body.dataset.quizArea=area;
document.title=`${area} · Quiz`;
document.getElementById('areaCode').textContent=`${area} · 20 domande casuali su 50`;
document.getElementById('quizTitle').textContent=bank.title;
const quiz=document.getElementById('quiz'),score=document.getElementById('score');
const shuffle=list=>{const copy=[...list];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]];}return copy;};
const stateKey=`area-quiz-state:${area}`;
const createState=()=>({
  questions:shuffle(bank.questions.map((_,index)=>index)).slice(0,20).map(questionIndex=>({
    questionIndex,
    optionOrder:shuffle([0,1,2])
  }))
});
const validState=state=>{
  if(!state||!Array.isArray(state.questions)||state.questions.length!==20)return false;
  const indexes=state.questions.map(item=>item.questionIndex);
  return new Set(indexes).size===20&&state.questions.every(item=>
    Number.isInteger(item.questionIndex)&&item.questionIndex>=0&&item.questionIndex<bank.questions.length&&
    Array.isArray(item.optionOrder)&&item.optionOrder.length===3&&new Set(item.optionOrder).size===3&&
    item.optionOrder.every(index=>Number.isInteger(index)&&index>=0&&index<3)
  );
};
let quizState;
try{quizState=JSON.parse(sessionStorage.getItem(stateKey)||'null');}catch{quizState=null;}
if(!validState(quizState)){
  quizState=createState();
  try{sessionStorage.setItem(stateKey,JSON.stringify(quizState));}catch{}
}
function render(){
  quiz.innerHTML='';
  quizState.questions.forEach((saved,index)=>{
    const question=bank.questions[saved.questionIndex];
    const options=saved.optionOrder.map(original=>({text:question.options[original],correct:original===question.correct}));
    const article=document.createElement('article');article.className='question';article.dataset.correct=String(options.findIndex(option=>option.correct));
    article.innerHTML=`<div class="q-head"><div class="q-num">${String(index+1).padStart(2,'0')}</div><h2></h2></div><div class="options"></div><p class="feedback"></p>`;
    article.querySelector('h2').textContent=question.text;article.querySelector('.feedback').textContent=question.feedback;
    options.forEach((option,optionIndex)=>{const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type='radio';input.name=`q${index+1}`;input.value=String(optionIndex);label.append(input,document.createTextNode(' '+option.text));article.querySelector('.options').append(label);});
    quiz.append(article);
  });
  score.textContent='0 / 20';
}
document.getElementById('check').addEventListener('click',()=>{let correct=0;quiz.querySelectorAll('.question').forEach(question=>{question.classList.add('answered');const picked=question.querySelector('input:checked');question.querySelectorAll('input').forEach(input=>{const option=input.closest('.option');option.classList.remove('correct','wrong');if(input.value===question.dataset.correct)option.classList.add('correct');else if(input===picked)option.classList.add('wrong');});if(picked?.value===question.dataset.correct)correct++;});score.textContent=`${correct} / 20`;});
render();
</script>
<script src="quiz-reporting-config.js"></script>
<script src="quiz-reporting.js"></script>
</body>
</html>
