<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Educazione digitale — reskin neobrutalista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}.deck-viewport{position:fixed;inset:0;overflow:hidden}.deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0}.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none}.slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1}img,video,canvas,svg{max-width:100%;max-height:100%}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.2s!important}}
*{box-sizing:border-box}.slide{background:#fffdf5;color:#000;padding:54px 64px;font-family:"Space Mono",monospace}.header{height:78px;border:4px solid #000;background:#f7cb46;box-shadow:8px 8px #000;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-weight:700;font-size:22px;text-transform:uppercase}.main{display:grid;grid-template-columns:1.42fr .58fr;gap:42px;margin-top:42px;height:790px}.hero{border:4px solid #000;background:#fe90e8;box-shadow:12px 12px #000;padding:58px 62px;position:relative}.eyebrow{font-weight:700;font-size:23px;text-transform:uppercase;letter-spacing:.08em}.title{font:400 112px/.9 "Archivo Black",sans-serif;text-transform:uppercase;letter-spacing:-.055em;margin:50px 0 38px;max-width:1100px}.lead{font-size:30px;line-height:1.35;max-width:920px}.burst{position:absolute;right:44px;top:38px;width:132px;height:132px;background:#99e885;border:4px solid #000;transform:rotate(11deg);display:grid;place-items:center;font-weight:700;font-size:27px;box-shadow:7px 7px #000}
.rail{display:grid;grid-template-rows:1fr 1fr 1fr;gap:28px}.block{border:4px solid #000;box-shadow:8px 8px #000;padding:30px;background:#c0f7fe;display:flex;flex-direction:column;justify-content:space-between}.block:nth-child(2){background:#99e885}.block:nth-child(3){background:#ffdc8b}.num{font:400 54px "Archivo Black"}.block span:last-child{font-size:23px;font-weight:700;text-transform:uppercase}.footer{position:absolute;left:64px;right:64px;bottom:34px;display:flex;justify-content:space-between;font-size:18px;font-weight:700;text-transform:uppercase}.dot{width:30px;height:30px;border-radius:50%;background:#000;display:inline-block;vertical-align:middle;margin-right:15px}
</style></head>
<body><div class="deck-viewport"><div class="deck-stage"><section class="slide active visible">
<div class="header"><span><i class="dot"></i>Educazione digitale</span><span>Programmare / PR04.01</span></div>
<div class="main"><div class="hero"><div class="eyebrow">Strumenti e ambiente</div><h1 class="title">Lavorare<br>e scegliere</h1><p class="lead">Editor, IDE e ambienti di sviluppo: capire il metodo prima di scegliere il software.</p><div class="burst">12<br>SLIDE</div></div>
<div class="rail"><div class="block"><b class="num">01</b><span>Capire gli strumenti</span></div><div class="block"><b class="num">02</b><span>Scegliere l’ambiente</span></div><div class="block"><b class="num">03</b><span>Preparare il setup</span></div></div></div>
<div class="footer"><span>Francesco Antonio Binetti</span><span>01 / 12</span></div>
</section></div></div>
<script>const s=document.querySelector('.deck-stage');function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform=`translate(${(innerWidth-1920*k)/2}px,${(innerHeight-1080*k)/2}px) scale(${k})`}addEventListener('resize',fit);fit();</script>
</body></html>
