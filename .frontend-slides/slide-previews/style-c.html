<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Educazione digitale — reskin manuale tecnico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#222}.deck-viewport{position:fixed;inset:0;overflow:hidden}.deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0}.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none}.slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1}img,video,canvas,svg{max-width:100%;max-height:100%}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.2s!important}}
:root{--paper:#ece9df;--ink:#151515;--red:#e53324;--gray:#c8c6bd}*{box-sizing:border-box}.slide{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Condensed",sans-serif;padding:52px 66px}.frame{position:absolute;inset:28px;border:2px solid var(--ink);pointer-events:none}.mast{display:grid;grid-template-columns:220px 1fr 220px;height:92px;border-bottom:2px solid var(--ink);align-items:center;font:600 19px "IBM Plex Mono";text-transform:uppercase;letter-spacing:.08em}.mast .mid{text-align:center}.mast .end{text-align:right}.signal{display:inline-block;width:18px;height:18px;background:var(--red);margin-right:14px}
.content{display:grid;grid-template-columns:280px 1fr;gap:68px;height:790px}.rail{border-right:2px solid var(--ink);padding:70px 38px 0 0}.rail-label{font:600 16px "IBM Plex Mono";text-transform:uppercase;letter-spacing:.12em;color:#555;margin-bottom:26px}.rail-num{font:700 112px/1 "IBM Plex Sans Condensed";color:var(--red);margin-bottom:50px}.step{border-top:1px solid var(--ink);padding:17px 0;font:500 18px "IBM Plex Mono";text-transform:uppercase}.step:last-child{border-bottom:1px solid var(--ink)}
.hero{padding-top:84px;position:relative}.kicker{font:600 20px "IBM Plex Mono";text-transform:uppercase;letter-spacing:.14em;color:var(--red)}.title{font:700 146px/.83 "IBM Plex Sans Condensed";text-transform:uppercase;letter-spacing:-.045em;margin:28px 0 42px;max-width:1250px}.lead{font-size:35px;line-height:1.32;max-width:970px}.rule{width:100%;height:18px;background:repeating-linear-gradient(90deg,var(--red) 0 48px,transparent 48px 65px);position:absolute;left:0;bottom:35px}.stamp{position:absolute;right:12px;top:68px;width:210px;height:210px;border:3px solid var(--red);border-radius:50%;display:grid;place-items:center;text-align:center;transform:rotate(-8deg);font:600 21px/1.25 "IBM Plex Mono";color:var(--red);text-transform:uppercase}.foot{position:absolute;left:66px;right:66px;bottom:46px;display:flex;justify-content:space-between;font:500 16px "IBM Plex Mono";text-transform:uppercase}
</style></head>
<body><div class="deck-viewport"><div class="deck-stage"><section class="slide active visible"><div class="frame"></div>
<div class="mast"><span><i class="signal"></i>Educazione digitale</span><span class="mid">Manuale operativo</span><span class="end">PR04.01</span></div>
<div class="content"><aside class="rail"><div class="rail-label">Sequenza / 04</div><div class="rail-num">01</div><div class="step">Strumenti</div><div class="step">Ambienti</div><div class="step">Setup</div></aside>
<main class="hero"><div class="kicker">Strumenti e ambiente</div><h1 class="title">Lavorare<br>e scegliere</h1><p class="lead">Editor, IDE e ambienti di sviluppo: capire il metodo prima di scegliere il software.</p><div class="stamp">Edizione<br>didattica<br>2026</div><div class="rule"></div></main></div>
<div class="foot"><span>Francesco Antonio Binetti</span><span>Scheda 01 / 12</span></div>
</section></div></div>
<script>const s=document.querySelector('.deck-stage');function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform=`translate(${(innerWidth-1920*k)/2}px,${(innerHeight-1080*k)/2}px) scale(${k})`}addEventListener('resize',fit);fit();</script>
</body></html>
